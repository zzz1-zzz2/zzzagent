[project]
name = "traceforce-llm"
version = "0.1.0"
description = "TraceForce model boundary: provider adapters and streaming protocol normalization"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.50.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceforce_llm"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
