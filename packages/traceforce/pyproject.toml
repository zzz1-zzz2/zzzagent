[project]
name = "traceforce"
version = "0.1.0"
description = "TraceForce Coding Agent: an evidence-first coding agent developed by zzz for bounded workspaces"
requires-python = ">=3.11"
dependencies = [
    "traceforce-runtime",
    "traceforce-llm",
    "mcp>=2.0.0,<2.1",
    "python-dotenv>=1.0,<2.0",
    "textual>=0.70,<1.0",
]

[project.scripts]
traceforce = "traceforce.cli:main"

[tool.uv.sources]
traceforce-runtime = { path = "../traceforce-runtime" }
traceforce-llm = { path = "../traceforce-llm" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceforce"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
