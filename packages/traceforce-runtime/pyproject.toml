[project]
name = "traceforce-runtime"
version = "0.1.0"
description = "TraceForce runtime: asynchronous agent loop, tools, sessions, context, and extensions"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.50.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0",
    "traceforce-llm",
]

[tool.uv.sources]
traceforce-llm = { path = "../traceforce-llm" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceforce_runtime"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
